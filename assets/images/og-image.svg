<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B3A6B"/>
      <stop offset="100%" style="stop-color:#122850"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8A020"/>
      <stop offset="100%" style="stop-color:#F5C05A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle radial glow -->
  <radialGradient id="glow" cx="30%" cy="50%" r="60%">
    <stop offset="0%" style="stop-color:#E8A020;stop-opacity:0.08"/>
    <stop offset="100%" style="stop-color:#1B3A6B;stop-opacity:0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Gold accent bar left -->
  <rect x="0" y="0" width="8" height="630" fill="#E8A020"/>

  <!-- Logo area circle -->
  <circle cx="200" cy="315" r="110" fill="rgba(255,255,255,0.06)" stroke="rgba(232,160,32,0.3)" stroke-width="2"/>

  <!-- Book icon (simplified) -->
  <g transform="translate(150,270)">
    <rect x="0" y="0" width="42" height="54" rx="4" fill="#E8A020"/>
    <rect x="46" y="0" width="42" height="54" rx="4" fill="#F5C05A"/>
    <rect x="19" y="0" width="4" height="54" fill="rgba(255,255,255,0.3)"/>
    <rect x="61" y="0" width="4" height="54" fill="rgba(255,255,255,0.2)"/>
    <line x1="8" y1="15" x2="36" y2="15" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
    <line x1="8" y1="23" x2="36" y2="23" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
    <line x1="8" y1="31" x2="36" y2="31" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
    <line x1="50" y1="15" x2="78" y2="15" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <line x1="50" y1="23" x2="78" y2="23" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
    <line x1="50" y1="31" x2="78" y2="31" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  </g>

  <!-- Organization name -->
  <text x="380" y="260" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="white" letter-spacing="-1">Christian Education</text>
  <text x="380" y="325" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="white" letter-spacing="-1">in Liberia</text>

  <!-- Gold divider -->
  <rect x="380" y="355" width="120" height="4" rx="2" fill="url(#gold)"/>

  <!-- Tagline -->
  <text x="380" y="400" font-family="Arial, sans-serif" font-size="26" fill="rgba(255,255,255,0.75)">Gifts of Hope Community School · Kakata, Liberia</text>

  <!-- Trust badges -->
  <g transform="translate(380, 445)">
    <rect width="160" height="36" rx="18" fill="rgba(232,160,32,0.18)" stroke="rgba(232,160,32,0.4)" stroke-width="1"/>
    <text x="80" y="23" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#E8A020" text-anchor="middle" letter-spacing="0.5">501(c)(3) VERIFIED</text>
  </g>
  <g transform="translate(556, 445)">
    <rect width="160" height="36" rx="18" fill="rgba(232,160,32,0.18)" stroke="rgba(232,160,32,0.4)" stroke-width="1"/>
    <text x="80" y="23" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#E8A020" text-anchor="middle" letter-spacing="0.5">100% TO SCHOOL</text>
  </g>
  <g transform="translate(732, 445)">
    <rect width="160" height="36" rx="18" fill="rgba(232,160,32,0.18)" stroke="rgba(232,160,32,0.4)" stroke-width="1"/>
    <text x="80" y="23" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#E8A020" text-anchor="middle" letter-spacing="0.5">TAX DEDUCTIBLE</text>
  </g>

  <!-- URL -->
  <text x="600" y="590" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.4)" text-anchor="middle" letter-spacing="1">celonline.org</text>
</svg>
